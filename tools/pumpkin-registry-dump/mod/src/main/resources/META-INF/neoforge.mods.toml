[[mods]]
modId = "pumpkin_registry_dump"
version = "1.0.0"
displayName = "Pumpkin Registry Dump"
description = '''
Writes pumpkin-registry.json next to the game directory once a world has
started: every registry with its numeric ids, every block state, item and
entity type, the tags, and the server config files of the pack. A Pumpkin
server reads it to know the mods' content by the ids this client uses.
'''
authors = "papaIOprog"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.pumpkin_registry_dump]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.pumpkin_registry_dump]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
