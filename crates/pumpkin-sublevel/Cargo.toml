[dependencies]
# Sequential physics on purpose: rapier is built without the `parallel`
# feature so stepping never dispatches onto rayon and can never compete
# with the chunk generation pool. The system is stepped once per world
# tick on the tick thread.
rapier3d = { workspace = true }

